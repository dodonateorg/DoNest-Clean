    <!-- Pre-check language preference for Google Translate -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('donest_lang');
          var lang = saved;
          if (!lang) {
            var navLang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
            if (navLang.toLowerCase().indexOf('fr') === 0) {
              lang = 'FR';
            } else {
              lang = 'EN';
            }
          }
          if (lang === 'FR') {
            document.cookie = 'googtrans=/en/fr; path=/;';
            document.cookie = 'googtrans=/auto/fr; path=/;';
          }
        } catch(e) {}
      })();
    </script>
